components:
  schemas:
    Bid:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bid_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total_amt:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/BidStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        buyer:
          type: string
          format: email
        listing:
          type: string
          format: uuid
      required:
      - buyer
      - created_at
      - listing
    BidStatusEnum:
      enum:
      - pending
      - accepted
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `rejected` - Rejected
    CustomJWT:
      type: object
      description: Serializer for JWT authentication.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          type: string
          readOnly: true
      required:
      - access
      - refresh
      - user
    CustomLogin:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - password
    CustomRegister:
      type: object
      properties:
        email:
          type: string
          format: email
        password1:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
        phone_number:
          type: string
          maxLength: 15
        user_type:
          $ref: '#/components/schemas/UserTypeEnum'
        user_category:
          $ref: '#/components/schemas/UserCategoryEnum'
        first_name:
          type: string
        last_name:
          type: string
        farmName:
          type: string
        location:
          type: string
        farmArea:
          type: number
          format: double
          nullable: true
        organizationName:
          type: string
        organizationType:
          type: string
        about:
          type: string
        tagline:
          type: string
        profileImg:
          type: string
          format: uri
          nullable: true
        heroImg:
          type: string
          format: uri
          nullable: true
      required:
      - email
      - password1
      - password2
      - user_category
      - user_type
    CustomSocialLogin:
      type: object
      properties:
        access_token:
          type: string
        code:
          type: string
        id_token:
          type: string
    CustomUserDetails:
      type: object
      description: User model w/o password
      properties:
        pk:
          type: string
          format: email
          title: Email
          maxLength: 254
        email:
          type: string
          format: email
          readOnly: true
      required:
      - email
      - pk
    ListingImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        Image:
          type: string
          format: uri
        _for:
          type: string
          format: uuid
          title: ' for'
      required:
      - Image
    Listings:
      type: object
      properties:
        id:
          type: string
          format: uuid
        listing_images:
          type: array
          items:
            $ref: '#/components/schemas/ListingImage'
        AskPrice:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        metrics:
          $ref: '#/components/schemas/MetricsEnum'
        Qty_available:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        seller:
          type: string
          format: email
        produce:
          type: string
          format: uuid
      required:
      - AskPrice
      - Qty_available
      - produce
      - seller
    Location:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        State:
          type: string
          maxLength: 25
        District:
          type: string
          maxLength: 25
        Market:
          type: string
          maxLength: 35
      required:
      - District
      - Market
      - State
      - id
    MarketPrice:
      type: object
      properties:
        _id:
          type: string
          format: uuid
          title: ' id'
        metrics:
          $ref: '#/components/schemas/MetricsEnum'
        modal_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        max_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        min_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        produce:
          type: string
          format: uuid
        location:
          type: integer
      required:
      - location
      - produce
    MetricsEnum:
      enum:
      - Kg
      - Q
      type: string
      description: |-
        * `Kg` - Kilogram
        * `Q` - Qunital
    PasswordChange:
      type: object
      properties:
        new_password1:
          type: string
          maxLength: 128
        new_password2:
          type: string
          maxLength: 128
      required:
      - new_password1
      - new_password2
    PasswordReset:
      type: object
      description: Serializer for requesting a password reset e-mail.
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PasswordResetConfirm:
      type: object
      description: Serializer for confirming a password reset attempt.
      properties:
        new_password1:
          type: string
          maxLength: 128
        new_password2:
          type: string
          maxLength: 128
        uid:
          type: string
        token:
          type: string
      required:
      - new_password1
      - new_password2
      - token
      - uid
    PatchedBid:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bid_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        quantity:
